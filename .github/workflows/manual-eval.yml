name: Manual Model Evaluation

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Evaluation date (YYYY-MM-DD). Leave empty for today.'
        required: false
        default: ''
      models:
        description: 'Comma-separated model ids to re-eval (empty = all enabled).'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  manual-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --upgrade pip requests

      - name: Restore previous leaderboard history from gh-pages
        # Generated artifacts are no longer committed to main; the trend
        # history lives on gh-pages. Pull it back so weeks accumulate.
        run: |
          mkdir -p data
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/data/leaderboard_history.json" \
            -o data/leaderboard_history.json || echo "no prior history on gh-pages"
        continue-on-error: true

      - name: Run evaluation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        run: |
          EVAL_DATE="${{ github.event.inputs.date }}"
          [ -z "$EVAL_DATE" ] && EVAL_DATE=$(date +%Y-%m-%d)
          python scripts/run_eval.py --date "$EVAL_DATE" --output data/

      - name: Generate dashboard
        run: python scripts/generate_dashboard.py --data data/ --output dashboard/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
          publish_branch: gh-pages
