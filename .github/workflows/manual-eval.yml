name: Manual Model Evaluation

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Evaluation date (YYYY-MM-DD). Leave empty for today.'
        required: false
        default: ''
      models:
        description: 'Comma-separated model ids to re-eval (empty = all enabled).'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  manual-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --upgrade pip requests

      - name: Run evaluation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        run: |
          EVAL_DATE="${{ github.event.inputs.date }}"
          [ -z "$EVAL_DATE" ] && EVAL_DATE=$(date +%Y-%m-%d)
          python scripts/run_eval.py --date "$EVAL_DATE" --output data/

      - name: Generate dashboard
        run: python scripts/generate_dashboard.py --data data/ --output dashboard/

      - name: Commit & push
        run: |
          git config user.name "legal-ai-watch[bot]"
          git config user.email "bot@legal-ai-watch.dev"
          git add data/ dashboard/
          git commit -m "eval: manual run $(date +%Y-%m-%d)" || echo "nothing to commit"

      - name: Push to main
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
          publish_branch: gh-pages
