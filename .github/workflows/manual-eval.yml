name: Manual Model Evaluation

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Evaluation date (YYYY-MM-DD). Leave empty for today.'
        required: false
        default: ''
      models:
        description: 'Comma-separated model ids to re-eval (empty = all enabled).'
        required: false
        default: ''
      samples:
        description: 'Samples per (model, question) for variance suppression. Higher = more stable HVI, more API calls.'
        required: false
        default: '3'
      scope:
        description: 'Run scope. full = all questions, updates public leaderboard. smoke = first 5 questions, cheap real-API validation, NO deploy (saves tokens after a key change).'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - smoke

permissions:
  contents: write

jobs:
  manual-eval:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Public eval does NOT need the private legal-hallucination-bench
          # submodule: run_eval.py reads config/questions.json committed in
          # main, and the eval step never calls sync_questions.py. Recursive
          # checkout of a private cross-repo submodule intermittently fails
          # under GITHUB_TOKEN and aborts the run.
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --upgrade pip requests pytest

      - name: Regression gate (pytest)
        # Blocks the deploy if the verifier / metrics / retry logic regressed.
        # A broken verifier would silently corrupt the leaderboard, so this
        # must run BEFORE any paid API calls.
        run: python -m pytest tests/ -q

      - name: Restore previous leaderboard history from gh-pages
        # Generated artifacts are no longer committed to main; the trend
        # history lives on gh-pages. Pull it back so weeks accumulate.
        run: |
          mkdir -p data
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/data/leaderboard_history.json" \
            -o data/leaderboard_history.json || echo "no prior history on gh-pages"
        continue-on-error: true

      - name: Run evaluation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        run: |
          EVAL_DATE="${{ github.event.inputs.date }}"
          [ -z "$EVAL_DATE" ] && EVAL_DATE=$(date +%Y-%m-%d)
          SAMPLES="${{ github.event.inputs.samples }}"
          [ -z "$SAMPLES" ] && SAMPLES=3
          SCOPE="${{ github.event.inputs.scope }}"
          [ -z "$SCOPE" ] && SCOPE=full
          if [ "$SCOPE" = "smoke" ]; then LIMIT=5; else LIMIT=0; fi
          python scripts/run_eval.py --date "$EVAL_DATE" --output data/ --samples "$SAMPLES" --limit "$LIMIT"

      - name: Generate dashboard
        if: ${{ github.event.inputs.scope != 'smoke' }}
        run: python scripts/generate_dashboard.py --data data/ --output dashboard/
        # generate_dashboard.py already embeds the full data/ into dashboard/data/
        # AND writes .nojekyll, so publish_dir: ./dashboard (flattened to the
        # gh-pages root) makes every link resolve — no extra `cp` needed.

      - name: Deploy to GitHub Pages
        if: ${{ github.event.inputs.scope != 'smoke' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
          publish_branch: gh-pages

  alert-on-failure:
    name: Alert on failure
    needs: manual-eval
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `CI Failure: Manual Model Evaluation #${context.runId}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The **Manual Model Evaluation** workflow failed.`,
              ``,
              `- Run: ${runUrl}`,
              `- Triggered by: ${context.actor}`,
              `- Time (UTC): ${new Date().toISOString()}`,
              ``,
              `A failed run means the weekly public leaderboard is stale. ` +
              `Check the run log before re-running.`
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure'
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing at ${new Date().toISOString()} — ${runUrl}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure']
              });
            }
