name: Weekly Model Evaluation

on:
  schedule:
    - cron: '0 0 * * 1'   # 每周一 00:00 UTC = 北京时间 08:00
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Public eval does NOT need the private legal-hallucination-bench
          # submodule: run_eval.py reads config/questions.json committed in
          # main, and the `sync_questions.py --source submodule` step is
          # best-effort (`|| echo "sync skipped"`) so it safely no-ops when the
          # submodule is absent. Recursive checkout of a private cross-repo
          # submodule intermittently fails under GITHUB_TOKEN and aborts the run.
          submodules: false
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --upgrade pip requests pytest

      - name: Regression gate (pytest)
        # Blocks the deploy if the verifier / metrics / retry logic regressed.
        # A broken verifier would silently corrupt the leaderboard, so this
        # must run BEFORE any paid API calls.
        run: python -m pytest tests/ -q

      - name: Sync questions from bench (best-effort)
        run: python scripts/sync_questions.py --source submodule || echo "sync skipped"

      - name: Snapshot last-good data/ from gh-pages (fallback)
        # Full snapshot of the deployed data/ (history + per-week answers) so a
        # failed evaluation can still deploy the previous good site instead of
        # going stale or publishing broken audit links.
        continue-on-error: true
        run: |
          rm -rf .data_fallback
          git fetch origin gh-pages --quiet || true
          if git cat-file -e origin/gh-pages:data/leaderboard_history.json 2>/dev/null; then
            git archive origin/gh-pages data | tar -x -C .
            mv data .data_fallback
            echo "FALLBACK_DATA=true" >> "$GITHUB_ENV"
          else
            echo "FALLBACK_DATA=false" >> "$GITHUB_ENV"
          fi

      - name: Restore previous leaderboard history from gh-pages
        # Generated artifacts are no longer committed to main; the trend
        # history lives on gh-pages. Pull it back so weeks accumulate.
        run: |
          mkdir -p data
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/data/leaderboard_history.json" \
            -o data/leaderboard_history.json || echo "no prior history on gh-pages"
        continue-on-error: true

      - name: Run evaluation
        id: eval
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        run: python scripts/run_eval.py --date $(date +%Y-%m-%d) --output data/ --samples 3

      - name: Ensure deployable data/ (fallback if eval failed)
        run: |
          if [ "${{ steps.eval.outcome }}" = "success" ] && [ -d data ] && [ -n "$(ls -A data 2>/dev/null)" ]; then
            echo "Using freshly evaluated data/"
          elif [ "${FALLBACK_DATA:-false}" = "true" ]; then
            echo "Evaluation failed — restoring last-good data/ from gh-pages"
            rm -rf data
            cp -R .data_fallback/data data
          else
            echo "::error::Evaluation failed and no fallback data available on gh-pages"
            exit 1
          fi

      - name: Open issue if eval failed (last-good deployed)
        if: ${{ steps.eval.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Weekly eval failed — deployed last-good data (run #${context.runId})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The weekly evaluation step failed, but the workflow deployed the **last-good** data/ from gh-pages so the public leaderboard is not stale.`,
              ``,
              `- Run: ${runUrl}`,
              `- Time (UTC): ${new Date().toISOString()}`,
              ``,
              `Action: check the run log, fix the eval, then re-run (workflow_dispatch).`
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'eval-failed'
            });
            const existing = issues.find(i => i.title === title);
            if (!existing) {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['eval-failed'] });
            }

      - name: Generate dashboard
        run: python scripts/generate_dashboard.py --data data/ --output dashboard/
        # generate_dashboard.py already embeds the full data/ into dashboard/data/
        # AND writes .nojekyll, so publish_dir: ./dashboard (flattened to the
        # gh-pages root) makes every link resolve — no extra `cp` needed.

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
          publish_branch: gh-pages

      - name: Post to social (optional)
        if: ${{ env.POST_SOCIAL == 'true' }}
        env:
          POST_SOCIAL: ${{ secrets.POST_SOCIAL }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: python scripts/post_to_social.py --date $(date +%Y-%m-%d) --data data/ --platforms twitter,linkedin

  alert-on-failure:
    name: Alert on failure
    needs: eval
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `CI Failure: Weekly Model Evaluation #${context.runId}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The **Weekly Model Evaluation** workflow failed and could NOT deploy (no fallback data available).`,
              ``,
              `- Run: ${runUrl}`,
              `- Triggered by: ${context.actor}`,
              `- Time (UTC): ${new Date().toISOString()}`,
              ``,
              `The public leaderboard is stale. Check the run log before re-running.`
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure'
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing at ${new Date().toISOString()} — ${runUrl}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure']
              });
            }
