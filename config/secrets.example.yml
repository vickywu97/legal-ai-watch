# Secrets example for Legal AI Watch
# ---------------------------------
# Copy this file to config/secrets.yml (which is gitignored) and fill in your keys,
# OR add these as GitHub Actions Secrets (Settings → Secrets and variables → Actions).
#
# Local usage:
#   cp config/secrets.example.yml config/secrets.yml
#   # then edit config/secrets.yml with real keys
#
# GitHub Actions: add each key as a repository secret with the SAME name.

DEEPSEEK_API_KEY: "sk-xxxxxxxxxxxxxxxxxxxxxxxx"
ZHIPU_API_KEY:   "xxxxxxxxxxxxxxxxxxxxxxxx"
DASHSCOPE_API_KEY: "sk-xxxxxxxxxxxxxxxxxxxxxxxx"
MOONSHOT_API_KEY: "sk-xxxxxxxxxxxxxxxxxxxxxxxx"

# Optional: social posting (post_to_social.py). Leave blank to skip.
TWITTER_API_KEY:        ""
TWITTER_API_SECRET:     ""
LINKEDIN_ACCESS_TOKEN:  ""
ZHIHU_COOKIE:           ""
